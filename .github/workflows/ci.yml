name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same PR cancels the first -- no point paying for a
# run whose result is already stale.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Unit tests first: they are seconds, and if the domain logic is broken
      # there is no point building the site or booting a browser.
      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # Report-only until Phase 4c, then this gains --strict and gates.
      - name: Breakpoint contract
        # --strict now that the contract is true: the declared set was
        # amended to the 900 the code actually uses (820 was declared and
        # used nowhere), and the two real singletons were normalised.
        # Without the gate it drifts straight back.
        run: node scripts/check-breakpoints.mjs --strict

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end + accessibility
        run: npx playwright test

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
